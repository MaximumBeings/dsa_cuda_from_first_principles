site_name: Data Structures and Algorithms in CUDA C++ — Under Development
site_description: Parallel-First Data Structures, From Arrays to Concurrent Hash Tables
site_author: Oluwaseyi Awoga
copyright: Copyright &copy; 2026 Oluwaseyi Awoga

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    logo: material/graph-outline

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - footnotes

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - "Part 0 — GPU Foundations for Data Structures and Algorithms":
      - "1. Why Data Structures Change Shape on a GPU": part0/01-why-data-structures-change-shape.md
      - "2. The CUDA Execution and Memory Model": part0/02-execution-and-memory-model.md
      - "3. Work, Span, and Complexity on a Parallel Machine": part0/03-work-span-and-complexity.md
  - "Part 1 — Parallel Primitives":
      - "4. Reduction, For Real": part1/04-reduction.md
      - "5. Scan (Prefix Sum)": part1/05-scan.md
      - "6. Stream Compaction": part1/06-stream-compaction.md
      - "7. Histograms": part1/07-histograms.md
  - "Part 2 — Linear Structures Under Concurrency":
      - "8. Concurrent Arrays and Growable Buffers": part2/08-concurrent-arrays.md
      - "9. Lock-Free Stacks": part2/09-lock-free-stacks.md
      - "10. Lock-Free Queues": part2/10-lock-free-queues.md
      - "11. Pointer-Chasing Linked Lists": part2/11-pointer-chasing-linked-lists.md
  - "Part 3 — Sorting":
      - "12. Bitonic Sort": part3/12-bitonic-sort.md
      - "13. Radix Sort": part3/13-radix-sort.md
      - "14. Merge Sort and Sample Sort": part3/14-merge-sort-and-sample-sort.md
  - "Part 4 — Trees":
      - "15. Binary Trees Without Recursion": part4/15-binary-trees-without-recursion.md
      - "16. Parallel Tree and Trie Construction": part4/16-parallel-tree-and-trie-construction.md
      - "17. Segment and Fenwick Trees for Range Queries": part4/17-segment-and-fenwick-trees-for-range-queries.md
      - "18. Spatial Trees": part4/18-spatial-trees.md
  - "Part 5 — Hash Tables":
      - "19. Open Addressing Under Concurrent Insertion": part5/19-open-addressing-under-concurrent-insertion.md
      - "20. Cuckoo Hashing for Guaranteed O(1) Worst-Case Lookup": part5/20-cuckoo-hashing-for-guaranteed-o1-worst-case-lookup.md
  - "Part 6 — Graphs":
      - "21. CSR and Its Alternatives": part6/21-csr-and-its-alternatives.md
      - "22. The Frontier Model for Parallel Breadth-First Search": part6/22-the-frontier-model-for-parallel-breadth-first-search.md
      - "23. Single-Source Shortest Paths": part6/23-single-source-shortest-paths.md
      - "24. Connected Components": part6/24-connected-components.md
      - "25. Minimum Spanning Trees": part6/25-minimum-spanning-trees.md
  - "Part 7 — Priority Structures and Concurrency":
      - "26. Heaps and Priority Queues on a GPU": part7/26-heaps-and-priority-queues-on-a-gpu.md
      - "27. Lock-Free and Atomic-Based Concurrent Structures": part7/27-lock-free-and-atomic-based-concurrent-structures.md
      - "28. Memory Pools and Custom Allocators for Dynamic Structures": part7/28-memory-pools-and-custom-allocators-for-dynamic-structures.md

extra:
  social: []
