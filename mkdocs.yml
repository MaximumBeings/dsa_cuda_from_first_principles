site_name: Data Structures and Algorithms in CUDA C++ — Under Development
site_description: Parallel-First Data Structures, From Arrays to Concurrent Hash Tables
site_author: Oluwaseyi Awoga
copyright: Copyright &copy; 2026 Oluwaseyi Awoga

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    logo: material/graph-outline

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - footnotes

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - "Part 0 — GPU Foundations for Data Structures and Algorithms":
      - "1. Why Data Structures Change Shape on a GPU": part0/01-why-data-structures-change-shape.md
      - "2. The CUDA Execution and Memory Model": part0/02-execution-and-memory-model.md
      - "3. Work, Span, and Complexity on a Parallel Machine": part0/03-work-span-and-complexity.md
  - "Part 1 — Parallel Primitives":
      - "4. Reduction, For Real": part1/04-reduction.md
      - "5. Scan (Prefix Sum)": part1/05-scan.md
      - "6. Stream Compaction": part1/06-stream-compaction.md

extra:
  social: []
